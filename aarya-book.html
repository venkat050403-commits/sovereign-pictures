
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d0a">
<title>AARYA | Sovereign Pictures</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #100d0a;
  color: #302419;
  font-family: Georgia, "Times New Roman", serif;
  -webkit-user-select: none;
  user-select: none;
}

#reader {
  position: fixed;
  inset: 0;
  background: #100d0a;
  touch-action: pan-y;
  overflow: hidden;
}

.spread {
  position: absolute;
  inset: 0;
  display: flex;
  width: 100%;
  max-width: 1500px;
  height: 100%;
  margin: auto;
  overflow: hidden;
}

.page {
  position: relative;
  display: flex;
  flex: 1 1 100%;
  min-width: 0;
  height: 100%;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  padding: 55px 26px;
  padding-top: max(55px, env(safe-area-inset-top));
  padding-bottom: max(55px, env(safe-area-inset-bottom));
  background: radial-gradient(ellipse at center, #fff9eb, #f0e1c1);
  -webkit-overflow-scrolling: touch;
}

.content {
  width: 100%;
  max-width: 570px;
  margin: auto;
  font-size: 18px;
  line-height: 1.9;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.cover { text-align: center; }

.brand {
  color: #98723b;
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
}

.cover h1 {
  margin: 26px 0 12px;
  font-size: clamp(40px, 8vw, 76px);
  letter-spacing: 6px;
  font-weight: normal;
}

.cover h2 {
  color: #98723b;
  font-size: 14px;
  font-weight: normal;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.gold-line {
  width: 75px;
  height: 1px;
  margin: 28px auto;
  background: #b38b4a;
}

.chapter-heading {
  margin-bottom: 28px;
  color: #98723b;
  font-size: 12px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 3px;
}

.page-number {
  position: absolute;
  bottom: max(15px, env(safe-area-inset-bottom));
  left: 0;
  right: 0;
  color: #9a825d;
  font-size: 11px;
  text-align: center;
  pointer-events: none;
}

#backButton {
  position: fixed;
  z-index: 30;
  top: max(14px, env(safe-area-inset-top));
  left: max(14px, env(safe-area-inset-left));
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(183, 143, 72, .65);
  border-radius: 50%;
  background: rgba(25, 19, 12, .92);
  color: #f2d59a;
  font-family: Arial, sans-serif;
  font-size: 29px;
  text-decoration: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 150ms ease;
  -webkit-tap-highlight-color: transparent;
}

#backButton.visible {
  opacity: 1;
  visibility: visible;
}

/* Page-turn layer, used only in two-page landscape mode */
.flip-page {
  position: absolute;
  z-index: 10;
  top: 0;
  bottom: 0;
  width: 50%;
  transform-style: preserve-3d;
  perspective: 1600px;
  pointer-events: none;
}

.flip-page.forward {
  right: 0;
  transform-origin: left center;
  animation: turnForward 560ms ease-in-out forwards;
}

.flip-page.backward {
  left: 0;
  transform-origin: right center;
  animation: turnBackward 560ms ease-in-out forwards;
}

.flip-face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 55px 22px;
  overflow: hidden;
  background: radial-gradient(ellipse at center, #fff9eb, #f0e1c1);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.flip-face .content {
  font-size: 16px;
  line-height: 1.8;
}

.flip-face.back {
  transform: rotateY(180deg);
  background: linear-gradient(90deg, #d7c29c, #fff5df);
}

.flip-page.backward .flip-face.back {
  transform: rotateY(-180deg);
}

.flip-page.backward .flip-face.front {
  transform: rotateY(0deg);
}

.flip-page.backward {
  animation-name: turnBackward;
}

@keyframes turnForward {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(-180deg); }
}

@keyframes turnBackward {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(180deg); }
}

/* Landscape phones and tablets use an open-book spread */
@media (min-width: 600px) and (orientation: landscape) {
  .spread {
    width: min(100%, 1500px);
  }

  .page {
    flex: 1 1 50%;
    padding: 65px 32px 55px;
  }

  .page + .page {
    border-left: 1px solid #d3bd93;
  }

  .content { font-size: 16px; }
}

@media (max-width: 480px) and (orientation: portrait) {
  .page { padding-left: 24px; padding-right: 24px; }
  .content { font-size: 17px; line-height: 1.85; }
}

@media (prefers-reduced-motion: reduce) {
  .flip-page { animation-duration: 1ms !important; }
  #backButton { transition: none; }
}
</style>
</head>

<body>

<div id="reader" aria-label="Story reader"></div>
<a id="backButton" href="./index.html" aria-label="Back to homepage">‹</a>

<script>
/*
  UNIVERSAL SOVEREIGN PICTURES READER

  These are temporary demo pages.
  Replace them with the real manuscript later.

  Portrait: one page with direct swiping.
  Landscape: two facing pages with a 3D turning effect.
*/

const STORY = {
  title: "AARYA",
  subtitle: "Part One: The Fall",
  pages: [
    { type: "cover", text: "SOVEREIGN PICTURES" },
    {
      heading: "A Temporary Preview",
      text: "Beyond the boundaries of the known universe, worlds existed that no human eye had ever witnessed.\n\nThis is temporary sample text for testing the reader. Your original AARYA manuscript will replace it."
    },
    {
      heading: "The Story Continues",
      text: "Every page of the finished novel will use this same reading layout.\n\nSwipe left to move forward. Swipe right to return to earlier pages."
    },
    {
      heading: "A Universal Reader",
      text: "This reader is designed for fantasy, romance, horror, and every other story on Sovereign Pictures.\n\nThe actual manuscript will be added separately."
    },
    {
      type: "cover",
      text: "SOVEREIGN PICTURES"
    },
    {
      heading: "End of Preview",
      text: "This is the end of the temporary demonstration. The complete story will replace these sample pages."
    }
  ]
};

const reader = document.getElementById("reader");
const backButton = document.getElementById("backButton");

let currentPage = 0;
let startX = 0;
let startY = 0;
let swiping = false;
let animating = false;
let suppressClickUntil = 0;
let hideTimer = null;

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function isTwoPageMode() {
  return window.matchMedia(
    "(min-width: 600px) and (orientation: landscape)"
  ).matches;
}

function hideBackButton() {
  clearTimeout(hideTimer);
  backButton.classList.remove("visible");
}

function showBackButton() {
  backButton.classList.add("visible");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    backButton.classList.remove("visible");
  }, 2500);
}

function pageHTML(index) {
  const item = STORY.pages[index];

  if (!item) return '<div class="content"></div>';

  if (item.type === "cover") {
    return `
      <div class="content cover">
        <div class="brand">${escapeHTML(item.text || "SOVEREIGN PICTURES")}</div>
        <div class="gold-line"></div>
        <h1>${escapeHTML(STORY.title)}</h1>
        <h2>${escapeHTML(STORY.subtitle)}</h2>
        <div class="gold-line"></div>
      </div>`;
  }

  return `
    <div class="content">
      ${item.heading
        ? `<div class="chapter-heading">${escapeHTML(item.heading)}</div>`
        : ""}
      ${escapeHTML(item.text || "")}
    </div>`;
}

function makePage(index) {
  const page = document.createElement("section");
  page.className = "page";
  page.innerHTML = pageHTML(index) +
    `<div class="page-number">${index + 1}</div>`;
  return page;
}

function renderPages() {
  const spread = document.createElement("div");
  spread.className = "spread";

  if (isTwoPageMode()) {
    const first = Math.floor(currentPage / 2) * 2;
    spread.appendChild(makePage(first));

    if (first + 1 < STORY.pages.length) {
      spread.appendChild(makePage(first + 1));
    }
  } else {
    spread.appendChild(makePage(currentPage));
  }

  reader.replaceChildren(spread);
}

function directTurn(direction) {
  const step = isTwoPageMode() ? 2 : 1;
  const next = currentPage + direction * step;

  if (next < 0 || next >= STORY.pages.length) return;

  currentPage = next;
  renderPages();
  hideBackButton();
}

function animatedTurn(direction) {
  if (animating) return;

  if (!isTwoPageMode()) {
    directTurn(direction);
    return;
  }

  const step = 2;
  const next = currentPage + direction * step;

  if (next < 0 || next >= STORY.pages.length) return;

  const spread = reader.querySelector(".spread");
  if (!spread) return;

  animating = true;
  hideBackButton();

  const flip = document.createElement("div");
  flip.className = "flip-page " +
    (direction > 0 ? "forward" : "backward");

  const front = document.createElement("div");
  front.className = "flip-face front";

  const back = document.createElement("div");
  back.className = "flip-face back";

  if (direction > 0) {
    // Turn the right-hand page to reveal the next spread.
    front.innerHTML = pageHTML(currentPage + 1);
    back.innerHTML = pageHTML(next);
  } else {
    // Turn the left-hand page back to the previous spread.
    front.innerHTML = pageHTML(currentPage);
    back.innerHTML = pageHTML(next + 1);
  }

  flip.append(front, back);
  spread.appendChild(flip);

  setTimeout(() => {
    currentPage = next;
    renderPages();
    animating = false;
  }, 570);
}

reader.addEventListener("touchstart", event => {
  if (event.touches.length !== 1 || animating) return;

  startX = event.touches[0].clientX;
  startY = event.touches[0].clientY;
  swiping = false;
}, { passive: true });

reader.addEventListener("touchmove", event => {
  if (!event.touches.length) return;

  const dx = event.touches[0].clientX - startX;
  const dy = event.touches[0].clientY - startY;

  if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) {
    swiping = true;
  }
}, { passive: true });

reader.addEventListener("touchend", event => {
  if (!event.changedTouches.length) return;

  const dx = event.changedTouches[0].clientX - startX;
  const dy = event.changedTouches[0].clientY - startY;

  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {
    swiping = true;
    suppressClickUntil = Date.now() + 500;

    if (dx < 0) animatedTurn(1);
    else animatedTurn(-1);
  } else if (!swiping) {
    showBackButton();
  }

  setTimeout(() => { swiping = false; }, 550);
}, { passive: true });

reader.addEventListener("click", () => {
  if (Date.now() < suppressClickUntil || swiping || animating) return;
  showBackButton();
});

backButton.addEventListener("click", () => {
  hideBackButton();
});

document.addEventListener("keydown", event => {
  if (event.key === "ArrowLeft") animatedTurn(1);
  if (event.key === "ArrowRight") animatedTurn(-1);
  if (event.key === "Escape") {
    window.location.href = "./index.html";
  }
});

let previousMode = isTwoPageMode();

window.addEventListener("resize", () => {
  const mode = isTwoPageMode();

  if (mode !== previousMode) {
    previousMode = mode;
    if (mode) currentPage = Math.floor(currentPage / 2) * 2;
    renderPages();
  }
});

renderPages();
</script>

</body>
</html>
