

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#100d0a">

<title>AARYA | Sovereign Pictures</title>

<style>

* { box-sizing: border-box; }

html, body {

  margin: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

}

body {

  font-family: Georgia, "Times New Roman", serif;

  background: #100d0a;

  color: #302419;

  -webkit-user-select: none;

  user-select: none;

}

#reader {

  position: fixed;

  inset: 0;

  overflow: hidden;

  background: #100d0a;

  touch-action: pan-y;

}

.page {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 55px 30px 60px;

  padding-top: max(55px, env(safe-area-inset-top));

  padding-bottom: max(60px, env(safe-area-inset-bottom));

  background:

    radial-gradient(ellipse at center, #fff9eb 0%, #f1e3c7 100%);

  overflow-y: auto;

  -webkit-overflow-scrolling: touch;

  opacity: 1;

  transform: translateX(0);

  transition: opacity 220ms ease, transform 220ms ease;

}

.page.turn-next {

  opacity: 0;

  transform: translateX(-35px);

}

.page.turn-previous {

  opacity: 0;

  transform: translateX(35px);

}

.content {

  width: 100%;

  max-width: 650px;

  margin: auto;

  font-size: 19px;

  line-height: 1.9;

  white-space: pre-line;

}

.cover {

  text-align: center;

}

.brand {

  color: #98723b;

  text-transform: uppercase;

  letter-spacing: 5px;

  font-size: 11px;

}

.cover h1 {

  font-size: clamp(45px, 12vw, 82px);

  letter-spacing: 7px;

  font-weight: normal;

  margin: 28px 0 12px;

}

.cover h2 {

  font-weight: normal;

  font-size: 15px;

  color: #98723b;

  letter-spacing: 4px;

  text-transform: uppercase;

}

.gold-line {

  width: 85px;

  height: 1px;

  background: #b38b4a;

  margin: 30px auto;

}

.chapter-heading {

  text-align: center;

  color: #98723b;

  text-transform: uppercase;

  letter-spacing: 3px;

  font-size: 12px;

  margin-bottom: 28px;

}

.page-number {

  position: absolute;

  bottom: max(17px, env(safe-area-inset-bottom));

  left: 0;

  right: 0;

  text-align: center;

  color: #9a825d;

  font-size: 12px;

  letter-spacing: 2px;

  pointer-events: none;

}

#backButton {

  position: fixed;

  z-index: 10;

  top: max(14px, env(safe-area-inset-top));

  left: max(14px, env(safe-area-inset-left));

  width: 46px;

  height: 46px;

  border-radius: 50%;

  border: 1px solid rgba(183, 143, 72, 0.65);

  background: rgba(25, 19, 12, 0.9);

  color: #f2d59a;

  font-size: 27px;

  display: flex;

  align-items: center;

  justify-content: center;

  text-decoration: none;

  opacity: 0;

  visibility: hidden;

  transition: opacity 180ms ease;

  -webkit-tap-highlight-color: transparent;

}

#backButton.visible {

  opacity: 1;

  visibility: visible;

}

@media (max-width: 480px) {

  .page { padding-left: 25px; padding-right: 25px; }

  .content { font-size: 17px; line-height: 1.85; }

}

@media (prefers-reduced-motion: reduce) {

  .page, #backButton { transition: none; }

}

</style>

</head>

<body>

<div id="reader" aria-label="Full-screen story reader"></div>

<a id="backButton" href="./index.html" aria-label="Back to homepage">‹</a>

<script>

/*

  UNIVERSAL SOVEREIGN PICTURES READER

  To use this reader for another story later, change STORY.title,

  STORY.subtitle and STORY.pages below.

  The pages here are temporary demo content, not the final AARYA

  manuscript.

*/

const STORY = {

  title: "AARYA",

  subtitle: "Part One: The Fall",

  pages: [

    {

      type: "cover",

      text: "SOVEREIGN PICTURES"

    },

    {

      heading: "A Temporary Preview",

      text: "Beyond the boundaries of the known universe, worlds existed that no human eye had ever witnessed.\n\nThis is temporary sample text, included only to test the full-screen reader. Your original AARYA manuscript will replace it."

    },

    {

      heading: "The Story Continues",

      text: "Each page of the finished novel will appear here in a clean, comfortable reading layout.\n\nSwipe left to turn to the next page. Swipe right to return to the previous page."

    },

    {

      type: "cover",

      heading: "Preview Complete",

      text: "The actual story will be added when we connect your manuscript."

    }

  ]

};

const reader = document.getElementById("reader");

const backButton = document.getElementById("backButton");

let currentPage = 0;

let startX = 0;

let startY = 0;

let isSwiping = false;

let hideBackTimer;

function escapeHTML(value) {

  return String(value).replace(/[&<>"']/g, char => ({

    "&": "&amp;",

    "<": "&lt;",

    ">": "&gt;",

    '"': "&quot;",

    "'": "&#39;"

  })[char]);

}

function renderPage(direction = "") {

  const page = STORY.pages[currentPage];

  const element = document.createElement("section");

  element.className = "page";

  if (direction === "next") element.classList.add("turn-next");

  if (direction === "previous") element.classList.add("turn-previous");

  let html = "";

  if (page.type === "cover") {

    html = `

      <div class="content cover">

        <div class="brand">${escapeHTML(page.text || "SOVEREIGN PICTURES")}</div>

        <div class="gold-line"></div>

        <h1>${escapeHTML(STORY.title)}</h1>

        <h2>${escapeHTML(STORY.subtitle)}</h2>

        <div class="gold-line"></div>

      </div>`;

  } else {

    html = `

      <div class="content">

        ${page.heading ? `<div class="chapter-heading">${escapeHTML(page.heading)}</div>` : ""}

        ${escapeHTML(page.text || "")}

      </div>`;

  }

  html += `<div class="page-number">${currentPage + 1}</div>`;

  element.innerHTML = html;

  reader.replaceChildren(element);

  if (direction) {

    requestAnimationFrame(() => {

      requestAnimationFrame(() => {

        element.classList.remove("turn-next", "turn-previous");

      });

    });

  }

}

function turnPage(direction) {

  const next = currentPage + direction;

  if (next < 0 || next >= STORY.pages.length) return;

  currentPage = next;

  renderPage(direction > 0 ? "next" : "previous");

}

function revealBackButton() {

  backButton.classList.add("visible");

  clearTimeout(hideBackTimer);

  hideBackTimer = setTimeout(() => {

    backButton.classList.remove("visible");

  }, 2500);

}

reader.addEventListener("touchstart", event => {

  if (event.touches.length !== 1) return;

  startX = event.touches[0].clientX;

  startY = event.touches[0].clientY;

  isSwiping = false;

}, { passive: true });

reader.addEventListener("touchmove", event => {

  if (!event.touches.length) return;

  const dx = event.touches[0].clientX - startX;

  const dy = event.touches[0].clientY - startY;

  if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) {

    isSwiping = true;

  }

}, { passive: true });

reader.addEventListener("touchend", event => {

  if (!event.changedTouches.length) return;

  const dx = event.changedTouches[0].clientX - startX;

  const dy = event.changedTouches[0].clientY - startY;

  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {

    isSwiping = true;

    if (dx < 0) {

      turnPage(1);

    } else {

      turnPage(-1);

    }

    // A swipe must never reveal the back arrow.

    clearTimeout(hideBackTimer);

    backButton.classList.remove("visible");

  } else if (!isSwiping) {

    revealBackButton();

  }

  setTimeout(() => { isSwiping = false; }, 50);

}, { passive: true });

reader.addEventListener("click", event => {

  if (isSwiping) return;

  revealBackButton();

});

backButton.addEventListener("click", () => {

  clearTimeout(hideBackTimer);

});

document.addEventListener("keydown", event => {

  if (event.key === "ArrowLeft") turnPage(1);

  if (event.key === "ArrowRight") turnPage(-1);

  if (event.key === "Escape") {

    window.location.href = "./index.html";

  }

});

renderPage();

</script>

</body>

</html>
