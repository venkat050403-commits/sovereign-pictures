

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#100d0a">

<title>AARYA | Sovereign Pictures</title>

<style>

* { box-sizing: border-box; }

html, body {

  margin: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

}

body {

  background: #100d0a;

  color: #302419;

  font-family: Georgia, "Times New Roman", serif;

  -webkit-user-select: none;

  user-select: none;

}

#reader {

  position: fixed;

  inset: 0;

  display: flex;

  justify-content: center;

  align-items: stretch;

  background: #100d0a;

  touch-action: pan-y;

}

.spread {

  display: flex;

  width: 100%;

  height: 100%;

  max-width: 1400px;

}

.page {

  position: relative;

  display: flex;

  flex: 1 1 100%;

  min-width: 0;

  height: 100%;

  align-items: center;

  justify-content: center;

  overflow-y: auto;

  padding: 55px 30px 55px;

  padding-top: max(55px, env(safe-area-inset-top));

  padding-bottom: max(55px, env(safe-area-inset-bottom));

  background: radial-gradient(ellipse at center, #fff9eb, #f0e1c1);

  -webkit-overflow-scrolling: touch;

}

.page + .page {

  border-left: 1px solid #d3bd93;

}

.content {

  width: 100%;

  max-width: 570px;

  margin: auto;

  font-size: 18px;

  line-height: 1.9;

  white-space: pre-line;

  overflow-wrap: anywhere;

}

.cover {

  text-align: center;

}

.brand {

  color: #98723b;

  font-size: 11px;

  text-transform: uppercase;

  letter-spacing: 4px;

}

.cover h1 {

  margin: 26px 0 12px;

  font-size: clamp(40px, 8vw, 76px);

  letter-spacing: 6px;

  font-weight: normal;

}

.cover h2 {

  color: #98723b;

  font-size: 14px;

  font-weight: normal;

  text-transform: uppercase;

  letter-spacing: 3px;

}

.gold-line {

  width: 75px;

  height: 1px;

  margin: 28px auto;

  background: #b38b4a;

}

.chapter-heading {

  margin-bottom: 28px;

  color: #98723b;

  font-size: 12px;

  text-align: center;

  text-transform: uppercase;

  letter-spacing: 3px;

}

.page-number {

  position: absolute;

  bottom: max(15px, env(safe-area-inset-bottom));

  left: 0;

  right: 0;

  color: #9a825d;

  font-size: 11px;

  text-align: center;

  pointer-events: none;

}

#backButton {

  position: fixed;

  z-index: 20;

  top: max(14px, env(safe-area-inset-top));

  left: max(14px, env(safe-area-inset-left));

  width: 44px;

  height: 44px;

  display: flex;

  align-items: center;

  justify-content: center;

  border: 1px solid rgba(183, 143, 72, .65);

  border-radius: 50%;

  background: rgba(25, 19, 12, .92);

  color: #f2d59a;

  font-family: Arial, sans-serif;

  font-size: 29px;

  text-decoration: none;

  opacity: 0;

  visibility: hidden;

  transition: opacity 150ms ease;

  -webkit-tap-highlight-color: transparent;

}

#backButton.visible {

  opacity: 1;

  visibility: visible;

}

@media (max-width: 480px) {

  .page { padding-left: 24px; padding-right: 24px; }

  .content { font-size: 17px; line-height: 1.85; }

}

/* Two facing pages on wider landscape screens */

@media (min-width: 700px) and (orientation: landscape) {

  .spread {

    width: min(100%, 1400px);

    height: 100%;

  }

  .page {

    flex: 1 1 50%;

    padding: 65px 45px 55px;

  }

  .page + .page {

    border-left: 1px solid #d3bd93;

  }

  .content { font-size: 17px; }

}

@media (prefers-reduced-motion: reduce) {

  #backButton { transition: none; }

}

</style>

</head>

<body>

<div id="reader" aria-label="Story reader"></div>

<a id="backButton" href="./index.html" aria-label="Back to homepage">‹</a>

<script>

/*

  UNIVERSAL SOVEREIGN PICTURES READER

  Temporary demonstration pages only.

  Later, replace this sample content with the actual story.

  On wider landscape screens, two pages appear together.

  On phones and portrait screens, one page appears at a time.

*/

const STORY = {

  title: "AARYA",

  subtitle: "Part One: The Fall",

  pages: [

    {

      type: "cover",

      text: "SOVEREIGN PICTURES"

    },

    {

      heading: "A Temporary Preview",

      text: "Beyond the boundaries of the known universe, worlds existed that no human eye had ever witnessed.\n\nThis is temporary sample text for testing the reader. Your original AARYA manuscript will replace it."

    },

    {

      heading: "The Story Continues",

      text: "Every page of the finished novel will use this same reading layout.\n\nSwipe left to move forward. Swipe right to return to earlier pages."

    },

    {

      heading: "A Universal Reader",

      text: "This reader is designed to be reused for fantasy, romance, horror, and every other story on Sovereign Pictures.\n\nThe actual manuscript will be added separately."

    },

    {

      type: "cover",

      text: "SOVEREIGN PICTURES"

    }

  ]

};

const reader = document.getElementById("reader");

const backButton = document.getElementById("backButton");

let currentPage = 0;

let startX = 0;

let startY = 0;

let swiping = false;

let suppressClickUntil = 0;

let hideTimer = null;

function escapeHTML(value) {

  return String(value).replace(/[&<>"']/g, char => ({

    "&": "&amp;",

    "<": "&lt;",

    ">": "&gt;",

    '"': "&quot;",

    "'": "&#39;"

  })[char]);

}

function isTwoPageMode() {

  return window.matchMedia(

    "(min-width: 700px) and (orientation: landscape)"

  ).matches;

}

function hideBackButton() {

  clearTimeout(hideTimer);

  backButton.classList.remove("visible");

}

function showBackButton() {

  backButton.classList.add("visible");

  clearTimeout(hideTimer);

  hideTimer = setTimeout(() => {

    backButton.classList.remove("visible");

  }, 2500);

}

function makePage(index) {

  const item = STORY.pages[index];

  const page = document.createElement("section");

  page.className = "page";

  let html = "";

  if (item.type === "cover") {

    html = `

      <div class="content cover">

        <div class="brand">${escapeHTML(item.text)}</div>

        <div class="gold-line"></div>

        <h1>${escapeHTML(STORY.title)}</h1>

        <h2>${escapeHTML(STORY.subtitle)}</h2>

        <div class="gold-line"></div>

      </div>`;

  } else {

    html = `

      <div class="content">

        ${item.heading

          ? `<div class="chapter-heading">${escapeHTML(item.heading)}</div>`

          : ""}

        ${escapeHTML(item.text || "")}

      </div>`;

  }

  html += `<div class="page-number">${index + 1}</div>`;

  page.innerHTML = html;

  return page;

}

function renderPages() {

  const spread = document.createElement("div");

  spread.className = "spread";

  const twoPages = isTwoPageMode();

  const firstIndex = twoPages

    ? Math.floor(currentPage / 2) * 2

    : currentPage;

  spread.appendChild(makePage(firstIndex));

  if (twoPages && firstIndex + 1 < STORY.pages.length) {

    spread.appendChild(makePage(firstIndex + 1));

  }

  reader.replaceChildren(spread);

}

function turnPage(direction) {

  const step = isTwoPageMode() ? 2 : 1;

  const next = currentPage + direction * step;

  if (next < 0 || next >= STORY.pages.length) return;

  currentPage = next;

  renderPages();

  // Turning pages never reveals the back arrow.

  hideBackButton();

}

reader.addEventListener("touchstart", event => {

  if (event.touches.length !== 1) return;

  startX = event.touches[0].clientX;

  startY = event.touches[0].clientY;

  swiping = false;

}, { passive: true });

reader.addEventListener("touchmove", event => {

  if (!event.touches.length) return;

  const dx = event.touches[0].clientX - startX;

  const dy = event.touches[0].clientY - startY;

  if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) {

    swiping = true;

  }

}, { passive: true });

reader.addEventListener("touchend", event => {

  if (!event.changedTouches.length) return;

  const dx = event.changedTouches[0].clientX - startX;

  const dy = event.changedTouches[0].clientY - startY;

  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {

    swiping = true;

    suppressClickUntil = Date.now() + 500;

    if (dx < 0) {

      turnPage(1);

    } else {

      turnPage(-1);

    }

  } else if (!swiping) {

    showBackButton();

  }

  setTimeout(() => { swiping = false; }, 550);

}, { passive: true });

reader.addEventListener("click", () => {

  if (Date.now() < suppressClickUntil || swiping) return;

  showBackButton();

});

backButton.addEventListener("click", event => {

  event.stopPropagation();

  hideBackButton();

});

document.addEventListener("keydown", event => {

  if (event.key === "ArrowLeft") turnPage(1);

  if (event.key === "ArrowRight") turnPage(-1);

  if (event.key === "Escape") {

    window.location.href = "./index.html";

  }

});

let lastLayout = isTwoPageMode();

window.addEventListener("resize", () => {

  const newLayout = isTwoPageMode();

  if (newLayout !== lastLayout) {

    lastLayout = newLayout;

    currentPage = newLayout

      ? Math.floor(currentPage / 2) * 2

      : currentPage;

    renderPages();

  }

});

renderPages();

</script>

</body>

</html>
