
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>AARYA | Sovereign Pictures</title>

<style>
:root {
  --gold: #d8b568;
  --paper: #f4ead4;
  --ink: #302719;
  --reader-font: 16px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  min-height: 100%;
  background: #080808;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #40331f, #080808 75%);
  color: #f7f0e2;
  font-family: Georgia, serif;
}

header {
  padding: 18px 16px;
  text-align: center;
  border-bottom: 1px solid #6e572b;
}

.brand {
  color: var(--gold);
  letter-spacing: 4px;
  font-size: 12px;
}

header a {
  display: inline-block;
  margin-top: 12px;
  color: #e7d5a8;
  font-size: 13px;
  text-decoration: none;
}

main {
  width: min(1000px, 96%);
  margin: 18px auto;
}

button, select {
  border: 1px solid var(--gold);
  color: var(--gold);
  background: #17140f;
  border-radius: 4px;
  padding: 10px 13px;
  font-family: inherit;
  font-size: 14px;
}

button {
  cursor: pointer;
  touch-action: manipulation;
}

button:disabled {
  opacity: .35;
  cursor: default;
}

select {
  max-width: 240px;
  min-width: 0;
}

.reader-actions, .toolbar, .controls {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.reader-actions {
  justify-content: space-between;
  margin-bottom: 12px;
}

.reader-actions .brand { margin-right: auto; }
.toolbar { margin-bottom: 12px; }

.book-shell {
  position: relative;
  width: 100%;
  height: min(68vh, 620px);
  height: min(68dvh, 620px);
  min-height: 360px;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
  overflow: hidden;
  isolation: isolate;
}

#book {
  position: relative;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  margin: 0 auto;
}

/* No external page border: avoids an artificial seam during rotation. */
.page {
  background: var(--paper);
  color: var(--ink);
  overflow: hidden;
  border: 0 !important;
  outline: none;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.page-inner {
  position: relative;
  width: 100%;
  height: 100%;
  padding: 30px 24px 42px;
  overflow: hidden;
  background: linear-gradient(
    90deg,
    #d2c09d 0%,
    #f4ead4 7%,
    #f8f0df 50%,
    #f1e4c9 100%
  );
  box-shadow: inset 0 0 0 1px #c6b38c;
}

.page h2 {
  font-size: 23px;
  font-weight: normal;
  text-align: center;
  line-height: 1.4;
  margin: 12px 0 24px;
}

.chapter {
  text-align: center;
  color: #80672f;
  font-size: 10px;
  letter-spacing: 2px;
  line-height: 1.8;
}

.page p {
  font-size: var(--reader-font);
  line-height: 1.7;
  letter-spacing: .2px;
  white-space: pre-line;
  overflow-wrap: anywhere;
  margin: 0 0 16px;
}

.page-number {
  position: absolute;
  bottom: 13px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 12px;
  color: #80672f;
}

.cover, .back-cover {
  background: radial-gradient(
    ellipse at center,
    #45351e 0%,
    #20180e 60%,
    #0b0907 100%
  );
  color: var(--gold);
  text-align: center;
}

.cover .page-inner, .back-cover .page-inner {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  padding: 24px 14px;
  background: radial-gradient(
    ellipse at center,
    #45351e 0%,
    #20180e 60%,
    #0b0907 100%
  );
  box-shadow: inset 0 0 0 5px var(--gold);
  color: var(--gold);
}

.cover .ornament, .back-cover .ornament {
  font-size: 30px;
  margin-bottom: 16px;
}

.cover h1 {
  font-size: clamp(32px, 6vw, 54px);
  letter-spacing: 5px;
  font-weight: normal;
  margin: 12px 0;
}

.cover p, .back-cover p {
  font-size: 10px;
  letter-spacing: 1.5px;
  line-height: 1.8;
}

.back-cover .page-inner { text-align: center; }
.back-cover h2 { letter-spacing: 4px; }

.progress-area {
  width: min(420px, 95%);
  margin: 10px auto 6px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: #c5b895;
  font: 12px Arial, sans-serif;
  margin-bottom: 7px;
}

.progress-track {
  height: 5px;
  background: #383024;
  border-radius: 5px;
  overflow: hidden;
}

#progress-bar {
  width: 0%;
  height: 100%;
  background: var(--gold);
  transition: width .2s ease;
}

.controls { margin: 10px auto 6px; }

#counter {
  color: #c5b895;
  font-size: 13px;
  min-width: 105px;
  text-align: center;
}

#status {
  text-align: center;
  color: #e7d5a8;
  font: 13px Arial, sans-serif;
  line-height: 1.6;
  margin: 8px auto;
}

.hint {
  text-align: center;
  color: #a99c80;
  font: 12px Arial, sans-serif;
  line-height: 1.7;
  margin: 12px 10px 24px;
}

/* Immersive reader */
body.reader-mode {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
  z-index: 9999;
}

body.reader-mode header { display: none; }

body.reader-mode main {
  position: absolute;
  inset: 0;
  width: 100%;
  max-width: none;
  height: 100%;
  margin: 0;
  padding:
    max(5px, env(safe-area-inset-top))
    8px
    max(5px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow: hidden;
  background: radial-gradient(ellipse at top, #40331f, #080808 75%);
}

body.reader-mode .reader-actions {
  flex: 0 0 auto;
  width: 100%;
  margin: 0;
  gap: 7px;
}

body.reader-mode .reader-actions .brand {
  font-size: 10px;
  letter-spacing: 2px;
}

body.reader-mode .toolbar {
  flex: 0 0 auto;
  margin: 1px auto;
  gap: 6px;
}

body.reader-mode button, body.reader-mode select {
  padding: 7px 9px;
  font-size: 12px;
}

body.reader-mode .book-shell {
  flex: 1 1 0;
  height: auto;
  width: 100%;
  min-height: 0;
  padding: 0;
  overflow: hidden;
}

body.reader-mode #book {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  max-width: 100%;
  margin: 0 auto;
}

body.reader-mode #status {
  flex: 0 0 auto;
  margin: 1px auto;
  font-size: 11px;
}

body.reader-mode .progress-area {
  flex: 0 0 auto;
  width: min(420px, 95%);
  margin: 2px auto;
}

body.reader-mode .controls {
  flex: 0 0 auto;
  margin: 2px auto;
  gap: 6px;
}

body.reader-mode #counter {
  min-width: 90px;
  font-size: 11px;
}

body.reader-mode .hint { display: none; }

@media (max-width: 500px) {
  main {
    width: 98%;
    margin-top: 12px;
  }

  .page-inner { padding: 24px 18px 40px; }
  .page h2 { font-size: 20px; }
  .reader-actions { gap: 6px; }
  .reader-actions button { padding: 9px 8px; }
  .toolbar { gap: 6px; }

  body.reader-mode main {
    padding-left: 5px;
    padding-right: 5px;
  }
}

@media (orientation: landscape) {
  body.reader-mode main {
    padding-top: max(3px, env(safe-area-inset-top));
    padding-bottom: max(3px, env(safe-area-inset-bottom));
    gap: 3px;
  }

  body.reader-mode .reader-actions,
  body.reader-mode .toolbar,
  body.reader-mode .controls { gap: 4px; }

  body.reader-mode button, body.reader-mode select {
    padding: 5px 7px;
    font-size: 11px;
  }

  body.reader-mode .progress-area {
    width: min(320px, 55%);
  }
}

@media (max-height: 450px) {
  body.reader-mode .reader-actions .brand,
  body.reader-mode #status { display: none; }

  body.reader-mode .progress-label { margin-bottom: 2px; }
  body.reader-mode .progress-track { height: 3px; }
}

@media (max-width: 350px) {
  body.reader-mode .reader-actions .brand { display: none; }
  body.reader-mode .reader-actions { justify-content: flex-end; }
  body.reader-mode .toolbar select { max-width: 145px; }
}
</style>
</head>

<body class="reader-mode">
<header>
  <div class="brand">SOVEREIGN PICTURES</div>
  <a href="library.html">← BACK TO STORY LIBRARY</a>
</header>

<main>
  <div class="reader-actions">
    <div class="brand">SOVEREIGN PICTURES</div>
    <button id="minimise" type="button">Minimise −</button>
    <button id="fullscreen" type="button">Fullscreen ⛶</button>
  </div>

  <div class="toolbar">
    <button id="font-down" type="button" aria-label="Decrease text size">A−</button>
    <span id="font-label" style="color:#c5b895;font-size:13px">Text 16px</span>
    <button id="font-up" type="button" aria-label="Increase text size">A+</button>
    <select id="chapter-select" aria-label="Go to chapter">
      <option value="0">Go to a chapter…</option>
      <option value="1">Free Preview</option>
    </select>
  </div>

  <div id="status" role="status">Loading Aarya's free preview…</div>

  <div class="book-shell">
    <div id="book"></div>
  </div>

  <div class="progress-area">
    <div class="progress-label">
      <span>Reading progress</span>
      <span id="progress-text">0%</span>
    </div>
    <div class="progress-track">
      <div id="progress-bar"></div>
    </div>
  </div>

  <div class="controls">
    <button id="prev" type="button" disabled>← Previous</button>
    <span id="counter">Loading…</span>
    <button id="next" type="button" disabled>Open Book →</button>
  </div>

  <p class="hint">
    Drag a page corner or swipe to turn pages.
    <br>Use A− and A+ to adjust text size.
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

<script>
(function () {
  "use strict";

  const SUPABASE_URL = "https://ffxmmzxknnrmglqvxwbc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_sFi_I9me6VPQy0Saj5eQzg_csLKDtOt";

  const $ = id => document.getElementById(id);

  const bookElement = $("book");
  const status = $("status");
  const prev = $("prev");
  const next = $("next");
  const counter = $("counter");
  const progressBar = $("progress-bar");
  const progressText = $("progress-text");
  const fontLabel = $("font-label");
  const fontDown = $("font-down");
  const fontUp = $("font-up");
  const chapterSelect = $("chapter-select");
  const minimise = $("minimise");
  const fullscreen = $("fullscreen");

  let fontSize = 16;
  let pageFlip = null;
  let resizeTimer = null;

  function scheduleResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      window.dispatchEvent(new Event("resize"));
    }, 200);
  }

  function setReaderMode(enabled) {
    document.body.classList.toggle("reader-mode", enabled);
    scheduleResize();
  }

  minimise.addEventListener("click", async function () {
    setReaderMode(false);

    if (document.fullscreenElement && document.exitFullscreen) {
      try {
        await document.exitFullscreen();
      } catch (error) {
        console.debug("Unable to exit browser fullscreen.");
      }
    }

    scheduleResize();
  });

  fullscreen.addEventListener("click", async function () {
    if (document.fullscreenElement) {
      try {
        await document.exitFullscreen();
      } catch (error) {
        status.textContent = "Use your browser controls to exit fullscreen.";
      }
      return;
    }

    setReaderMode(true);

    if (document.documentElement.requestFullscreen) {
      try {
        await document.documentElement.requestFullscreen();
      } catch (error) {
        status.textContent =
          "Reader view is open. System fullscreen isn't available in this browser.";
      }
    } else {
      status.textContent = "Reader view is fitted to your screen.";
    }

    scheduleResize();
  });

  document.addEventListener("fullscreenchange", function () {
    fullscreen.textContent = document.fullscreenElement
      ? "Exit Fullscreen"
      : "Fullscreen ⛶";
    scheduleResize();
  });

  window.addEventListener("resize", scheduleResize);
  window.addEventListener("orientationchange", function () {
    scheduleResize();
    setTimeout(function () {
      window.dispatchEvent(new Event("resize"));
    }, 500);
  });

  function updateFontSize() {
    document.documentElement.style.setProperty("--reader-font", fontSize + "px");
    fontLabel.textContent = "Text " + fontSize + "px";
    fontDown.disabled = fontSize <= 12;
    fontUp.disabled = fontSize >= 24;
  }

  fontDown.addEventListener("click", function () {
    fontSize = Math.max(12, fontSize - 1);
    updateFontSize();
  });

  fontUp.addEventListener("click", function () {
    fontSize = Math.min(24, fontSize + 1);
    updateFontSize();
  });

  updateFontSize();

  function makePage(kind, chapterName, heading, text, number) {
    const page = document.createElement("div");
    page.className = "page" + (kind ? " " + kind : "");

    if (kind === "cover" || kind === "back-cover") {
      page.dataset.density = "hard";
    }

    const inner = document.createElement("div");
    inner.className = "page-inner";

    if (kind === "cover") {
      const ornament = document.createElement("div");
      ornament.className = "ornament";
      ornament.textContent = "✧ ❖ ✧";

      const brand = document.createElement("p");
      brand.textContent = "A SOVEREIGN PICTURES ORIGINAL";

      const title = document.createElement("h1");
      title.textContent = "AARYA";

      const subtitle = document.createElement("p");
      subtitle.innerHTML = "A LEGEND BEGINS<br><br>DRAG THE PAGE TO OPEN";

      inner.append(ornament, brand, title, subtitle);
    } else if (kind === "back-cover") {
      const ornament = document.createElement("div");
      ornament.className = "ornament";
      ornament.textContent = "✧";

      const title = document.createElement("h2");
      title.textContent = "AARYA";

      const brand = document.createElement("p");
      brand.textContent = "A SOVEREIGN PICTURES ORIGINAL";

      const ending = document.createElement("p");
      ending.textContent = "THE LEGEND CONTINUES";

      inner.append(ornament, title, brand, ending);
    } else {
      const chapter = document.createElement("div");
      chapter.className = "chapter";
      chapter.textContent = chapterName;

      const title = document.createElement("h2");
      title.textContent = heading;

      const paragraph = document.createElement("p");
      paragraph.textContent = text || "";

      const pageNumber = document.createElement("div");
      pageNumber.className = "page-number";
      pageNumber.textContent = String(number);

      inner.append(chapter, title, paragraph, pageNumber);
    }

    page.appendChild(inner);
    return page;
  }

  function updateControls() {
    if (!pageFlip) return;

    const index = pageFlip.getCurrentPageIndex();
    const total = pageFlip.getPageCount();

    prev.disabled = index <= 0;
    next.disabled = index >= total - 1;

    if (index === 0) {
      counter.textContent = "Cover";
      next.textContent = "Open Book →";
    } else if (index === total - 1) {
      counter.textContent = "Back Cover";
      next.textContent = "The End";
    } else {
      counter.textContent = "Page " + index + " of " + (total - 2);
      next.textContent = "Next Page →";
    }

    const percent = total > 1
      ? Math.round(index / (total - 1) * 100)
      : 0;

    progressBar.style.width = percent + "%";
    progressText.textContent = percent + "%";
    chapterSelect.value = index === 1 ? "1" : "0";
  }

  function showBook(sample) {
    bookElement.replaceChildren();

    bookElement.appendChild(makePage("cover", "", "", "", 0));

    bookElement.appendChild(makePage(
      "",
      "FREE PREVIEW",
      sample.title || "Aarya",
      sample.sample_content,
      1
    ));

    bookElement.appendChild(makePage(
      "",
      "CONTINUE THE JOURNEY",
      "The Story Continues",
      "You've reached the end of the free preview.\n\nThe complete Aarya story will be available to active subscribers once premium reading is connected.",
      2
    ));

    bookElement.appendChild(makePage("back-cover", "", "", "", 0));

    if (!window.St || !window.St.PageFlip) {
      status.textContent = "The page-turn library did not load. Refresh and try again.";
      counter.textContent = "Reader unavailable";
      return;
    }

    try {
      pageFlip = new St.PageFlip(bookElement, {
        width: 400,
        height: 600,
        size: "stretch",
        minWidth: 300,
        maxWidth: 800,
        minHeight: 400,
        maxHeight: 1200,
        startPage: 0,
        drawShadow: true,
        flippingTime: 500,
        usePortrait: true,
        startZIndex: 0,
        autoSize: false,
        maxShadowOpacity: 0.35,
        showCover: true,
        mobileScrollSupport: true,
        clickEventForward: true,
        useMouseEvents: true,
        swipeDistance: 30,
        showPageCorners: true,
        disableFlipByClick: false
      });

      pageFlip.loadFromHTML(bookElement.querySelectorAll(".page"));

      prev.addEventListener("click", function () {
        if (pageFlip) pageFlip.flipPrev();
      });

      next.addEventListener("click", function () {
        if (pageFlip) pageFlip.flipNext();
      });

      chapterSelect.addEventListener("change", function () {
        if (pageFlip && chapterSelect.value === "1") {
          pageFlip.flip(1);
        }
      });

      pageFlip.on("flip", updateControls);
      updateControls();

      status.textContent =
        "Aarya's cover is ready. Turn the cover to read the free preview.";

      scheduleResize();
    } catch (error) {
      console.error("Reader initialization error:", error);
      status.textContent = "The reader couldn't start. Please refresh and try again.";
      counter.textContent = "Reader unavailable";
    }
  }

  async function loadPreview() {
    try {
      if (!window.supabase) {
        throw new Error("The database library did not load.");
      }

      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      const { data, error } = await client
        .from("story_samples")
        .select("title, sample_content")
        .eq("slug", "aarya")
        .eq("is_published", true)
        .single();

      if (error) throw error;
      if (!data || !data.sample_content) {
        throw new Error("No published preview was found.");
      }

      showBook(data);
    } catch (error) {
      console.error("Aarya preview error:", error);
      status.textContent = "We couldn't load the preview. Please refresh and try again.";
      counter.textContent = "Preview unavailable";
      prev.disabled = true;
      next.disabled = true;
    }
  }

  loadPreview();
})();
</script>
</body>
</html>
