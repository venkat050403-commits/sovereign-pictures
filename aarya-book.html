

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#100d0a">

<title>AARYA | Sovereign Pictures</title>

<style>

* { box-sizing: border-box; }

html, body {

  margin: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

}

body {

  background: #100d0a;

  color: #302419;

  font-family: Georgia, "Times New Roman", serif;

  -webkit-user-select: none;

  user-select: none;

}

#reader {

  position: fixed;

  inset: 0;

  background: #100d0a;

  touch-action: pan-y;

  overflow: hidden;

}

.spread {

  position: absolute;

  inset: 0;

  display: flex;

  width: 100%;

  max-width: 1500px;

  height: 100%;

  margin: auto;

  overflow: hidden;

}

.page {

  position: relative;

  display: flex;

  flex: 1 1 100%;

  min-width: 0;

  height: 100%;

  align-items: center;

  justify-content: center;

  overflow-y: auto;

  padding: 55px 26px;

  padding-top: max(55px, env(safe-area-inset-top));

  padding-bottom: max(55px, env(safe-area-inset-bottom));

  background: radial-gradient(ellipse at center, #fff9eb, #f0e1c1);

  -webkit-overflow-scrolling: touch;

}

.content {

  width: 100%;

  max-width: 570px;

  margin: auto;

  font-size: 18px;

  line-height: 1.9;

  white-space: pre-line;

  overflow-wrap: anywhere;

}

.cover { text-align: center; }

.brand {

  color: #98723b;

  font-size: 11px;

  letter-spacing: 4px;

  text-transform: uppercase;

}

.cover h1 {

  margin: 26px 0 12px;

  font-size: clamp(40px, 8vw, 76px);

  letter-spacing: 6px;

  font-weight: normal;

}

.cover h2 {

  color: #98723b;

  font-size: 14px;

  font-weight: normal;

  letter-spacing: 3px;

  text-transform: uppercase;

}

.gold-line {

  width: 75px;

  height: 1px;

  margin: 28px auto;

  background: #b38b4a;

}

.chapter-heading {

  margin-bottom: 28px;

  color: #98723b;

  font-size: 12px;

  text-align: center;

  text-transform: uppercase;

  letter-spacing: 3px;

}

.page-number {

  position: absolute;

  bottom: max(15px, env(safe-area-inset-bottom));

  left: 0;

  right: 0;

  color: #9a825d;

  font-size: 11px;

  text-align: center;

  pointer-events: none;

}

#backButton {

  position: fixed;

  z-index: 30;

  top: max(14px, env(safe-area-inset-top));

  left: max(14px, env(safe-area-inset-left));

  width: 44px;

  height: 44px;

  display: flex;

  align-items: center;

  justify-content: center;

  border: 1px solid rgba(183, 143, 72, .65);

  border-radius: 50%;

  background: rgba(25, 19, 12, .92);

  color: #f2d59a;

  font-family: Arial, sans-serif;

  font-size: 29px;

  text-decoration: none;

  opacity: 0;

  visibility: hidden;

  transition: opacity 150ms ease;

  -webkit-tap-highlight-color: transparent;

}

#backButton.visible {

  opacity: 1;

  visibility: visible;

}

/* Full story access button */

#fullStoryButton {

  position: fixed;

  z-index: 40;

  top: max(14px, env(safe-area-inset-top));

  right: max(14px, env(safe-area-inset-right));

  min-height: 44px;

  padding: 0 17px;

  border: 1px solid #b38b4a;

  border-radius: 24px;

  background: rgba(25, 19, 12, .95);

  color: #f2d59a;

  font-family: Arial, sans-serif;

  font-size: 12px;

  letter-spacing: 1px;

  cursor: pointer;

}

#fullStoryButton:disabled {

  opacity: .65;

  cursor: wait;

}

/* Access messages */

#accessMessage {

  display: none;

  position: fixed;

  z-index: 50;

  left: 50%;

  bottom: max(22px, env(safe-area-inset-bottom));

  transform: translateX(-50%);

  width: min(92%, 440px);

  padding: 18px;

  border: 1px solid rgba(179, 139, 74, .8);

  border-radius: 12px;

  background: rgba(25, 19, 12, .97);

  color: #f5e8ce;

  text-align: center;

  box-shadow: 0 8px 35px rgba(0,0,0,.4);

  font-family: Arial, sans-serif;

}

#accessMessage.visible {

  display: block;

}

#accessText {

  margin: 0 0 12px;

  font-size: 14px;

  line-height: 1.6;

}

#accessLink {

  display: none;

  color: #f2d59a;

  font-size: 13px;

  text-decoration: underline;

}

#closeMessage {

  position: absolute;

  top: 5px;

  right: 10px;

  border: 0;

  background: transparent;

  color: #f2d59a;

  font-size: 22px;

  cursor: pointer;

}

/* Page-turn layer */

.flip-page {

  position: absolute;

  z-index: 10;

  top: 0;

  bottom: 0;

  width: 50%;

  transform-style: preserve-3d;

  perspective: 1600px;

  pointer-events: none;

}

.flip-page.forward {

  right: 0;

  transform-origin: left center;

  animation: turnForward 560ms ease-in-out forwards;

}

.flip-page.backward {

  left: 0;

  transform-origin: right center;

  animation: turnBackward 560ms ease-in-out forwards;

}

.flip-face {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 55px 22px;

  overflow: hidden;

  background: radial-gradient(ellipse at center, #fff9eb, #f0e1c1);

  backface-visibility: hidden;

  -webkit-backface-visibility: hidden;

}

.flip-face .content {

  font-size: 16px;

  line-height: 1.8;

}

.flip-face.back {

  transform: rotateY(180deg);

  background: linear-gradient(90deg, #d7c29c, #fff5df);

}

.flip-page.backward .flip-face.back {

  transform: rotateY(-180deg);

}

.flip-page.backward .flip-face.front {

  transform: rotateY(0deg);

}

.flip-page.backward {

  animation-name: turnBackward;

}

@keyframes turnForward {

  from { transform: rotateY(0deg); }

  to { transform: rotateY(-180deg); }

}

@keyframes turnBackward {

  from { transform: rotateY(0deg); }

  to { transform: rotateY(180deg); }

}

@media (min-width: 600px) and (orientation: landscape) {

  .spread {

    width: min(100%, 1500px);

  }

  .page {

    flex: 1 1 50%;

    padding: 65px 32px 55px;

  }

  .page + .page {

    border-left: 1px solid #d3bd93;

  }

  .content { font-size: 16px; }

}

@media (max-width: 480px) and (orientation: portrait) {

  .page { padding-left: 24px; padding-right: 24px; }

  .content { font-size: 17px; line-height: 1.85; }

  #fullStoryButton {

    font-size: 10px;

    padding: 0 12px;

  }

}

@media (prefers-reduced-motion: reduce) {

  .flip-page { animation-duration: 1ms !important; }

  #backButton { transition: none; }

}

</style>

</head>

<body>

<div id="reader" aria-label="Story reader"></div>

<a id="backButton" href="./index.html" aria-label="Back to homepage">‹</a>

<button id="fullStoryButton" type="button">

  READ FULL STORY

</button>

<div id="accessMessage" role="status" aria-live="polite">

  <button id="closeMessage" type="button" aria-label="Close">×</button>

  <p id="accessText"></p>

  <a id="accessLink" href="./login.html"></a>

</div>

<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* SUPABASE CONNECTION */

const SUPABASE_URL = "https://ffxmmzxknnrmglqvxwbc.supabase.co";

const SUPABASE_KEY = "sb_publishable_sFi_I9me6VPQy0Saj5eQzg_csLKDtOt";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {

  auth: {

    persistSession: true,

    autoRefreshToken: true,

    detectSessionInUrl: true

  }

});

/* PUBLIC PREVIEW */

const STORY = {

  title: "AARYA",

  subtitle: "Part One: The Fall",

  pages: [

    { type: "cover", text: "SOVEREIGN PICTURES" },

    {

      heading: "A Temporary Preview",

      text: "Beyond the boundaries of the known universe, worlds existed that no human eye had ever witnessed.\n\nThis is a preview of AARYA: Part One — The Fall."

    },

    {

      heading: "The Story Continues",

      text: "Every world has a history. Every kingdom has secrets. And sometimes, the fate of an entire world rests upon the shoulders of someone who never asked for it."

    },

    {

      heading: "A Universal Story",

      text: "Aarya's journey begins in a world far beyond our own. What awaits her will change the fate of more than one universe."

    },

    {

      type: "cover",

      text: "SOVEREIGN PICTURES"

    },

    {

      heading: "End of Preview",

      text: "You have reached the end of the public preview.\n\nThe complete AARYA: Part One — The Fall is available to eligible Stories subscribers.\n\nTap READ FULL STORY above to continue."

    }

  ]

};

const reader = document.getElementById("reader");

const backButton = document.getElementById("backButton");

const fullStoryButton = document.getElementById("fullStoryButton");

const accessMessage = document.getElementById("accessMessage");

const accessText = document.getElementById("accessText");

const accessLink = document.getElementById("accessLink");

const closeMessage = document.getElementById("closeMessage");

let currentPage = 0;

let startX = 0;

let startY = 0;

let swiping = false;

let animating = false;

let suppressClickUntil = 0;

let hideTimer = null;

function escapeHTML(value) {

  return String(value).replace(/[&<>"']/g, char => ({

    "&": "&amp;",

    "<": "&lt;",

    ">": "&gt;",

    '"': "&quot;",

    "'": "&#39;"

  })[char]);

}

function isTwoPageMode() {

  return window.matchMedia(

    "(min-width: 600px) and (orientation: landscape)"

  ).matches;

}

function hideBackButton() {

  clearTimeout(hideTimer);

  backButton.classList.remove("visible");

}

function showBackButton() {

  backButton.classList.add("visible");

  clearTimeout(hideTimer);

  hideTimer = setTimeout(() => {

    backButton.classList.remove("visible");

  }, 2500);

}

function showAccessMessage(message, linkText = "", linkHref = "") {

  accessText.textContent = message;

  if (linkText && linkHref) {

    accessLink.textContent = linkText;

    accessLink.href = linkHref;

    accessLink.style.display = "inline-block";

  } else {

    accessLink.style.display = "none";

  }

  accessMessage.classList.add("visible");

}

function hideAccessMessage() {

  accessMessage.classList.remove("visible");

}

closeMessage.addEventListener("click", hideAccessMessage);

function pageHTML(index) {

  const item = STORY.pages[index];

  if (!item) return '<div class="content"></div>';

  if (item.type === "cover") {

    return `

      <div class="content cover">

        <div class="brand">${escapeHTML(item.text || "SOVEREIGN PICTURES")}</div>

        <div class="gold-line"></div>

        <h1>${escapeHTML(STORY.title)}</h1>

        <h2>${escapeHTML(STORY.subtitle)}</h2>

        <div class="gold-line"></div>

      </div>`;

  }

  return `

    <div class="content">

      ${item.heading

        ? `<div class="chapter-heading">${escapeHTML(item.heading)}</div>`

        : ""}

      ${escapeHTML(item.text || "")}

    </div>`;

}

function makePage(index) {

  const page = document.createElement("section");

  page.className = "page";

  page.innerHTML = pageHTML(index) +

    `<div class="page-number">${index + 1}</div>`;

  return page;

}

function renderPages() {

  const spread = document.createElement("div");

  spread.className = "spread";

  if (isTwoPageMode()) {

    const first = Math.floor(currentPage / 2) * 2;

    spread.appendChild(makePage(first));

    if (first + 1 < STORY.pages.length) {

      spread.appendChild(makePage(first + 1));

    }

  } else {

    spread.appendChild(makePage(currentPage));

  }

  reader.replaceChildren(spread);

}

function directTurn(direction) {

  const step = isTwoPageMode() ? 2 : 1;

  const next = currentPage + direction * step;

  if (next < 0 || next >= STORY.pages.length) return;

  currentPage = next;

  renderPages();

  hideBackButton();

}

function animatedTurn(direction) {

  if (animating) return;

  if (!isTwoPageMode()) {

    directTurn(direction);

    return;

  }

  const step = 2;

  const next = currentPage + direction * step;

  if (next < 0 || next >= STORY.pages.length) return;

  const spread = reader.querySelector(".spread");

  if (!spread) return;

  animating = true;

  hideBackButton();

  const flip = document.createElement("div");

  flip.className = "flip-page " +

    (direction > 0 ? "forward" : "backward");

  const front = document.createElement("div");

  front.className = "flip-face front";

  const back = document.createElement("div");

  back.className = "flip-face back";

  if (direction > 0) {

    front.innerHTML = pageHTML(currentPage + 1);

    back.innerHTML = pageHTML(next);

  } else {

    front.innerHTML = pageHTML(currentPage);

    back.innerHTML = pageHTML(next + 1);

  }

  flip.append(front, back);

  spread.appendChild(flip);

  setTimeout(() => {

    currentPage = next;

    renderPages();

    animating = false;

  }, 570);

}

/* TOUCH CONTROLS */

reader.addEventListener("touchstart", event => {

  if (event.touches.length !== 1 || animating) return;

  startX = event.touches[0].clientX;

  startY = event.touches[0].clientY;

  swiping = false;

}, { passive: true });

reader.addEventListener("touchmove", event => {

  if (!event.touches.length) return;

  const dx = event.touches[0].clientX - startX;

  const dy = event.touches[0].clientY - startY;

  if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) {

    swiping = true;

  }

}, { passive: true });

reader.addEventListener("touchend", event => {

  if (!event.changedTouches.length) return;

  const dx = event.changedTouches[0].clientX - startX;

  const dy = event.changedTouches[0].clientY - startY;

  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {

    swiping = true;

    suppressClickUntil = Date.now() + 500;

    if (dx < 0) animatedTurn(1);

    else animatedTurn(-1);

  } else if (!swiping) {

    showBackButton();

  }

  setTimeout(() => { swiping = false; }, 550);

}, { passive: true });

reader.addEventListener("click", () => {

  if (Date.now() < suppressClickUntil || swiping || animating) return;

  showBackButton();

});

/* FULL STORY SUBSCRIPTION ACCESS */

async function openFullStory() {

  fullStoryButton.disabled = true;

  fullStoryButton.textContent = "CHECKING ACCESS...";

  hideAccessMessage();

  try {

    const {

      data: { session },

      error: sessionError

    } = await supabase.auth.getSession();

    if (sessionError || !session) {

      showAccessMessage(

        "Please log in to access the complete AARYA story.",

        "LOG IN",

        "./login.html"

      );

      return;

    }

    const { data, error } = await supabase.functions.invoke(

      "get-premium-story",

      {

        body: {}

      }

    );

    if (error) {

      let message = error.message || "Unable to verify your subscription.";

      if (error.context && typeof error.context.json === "function") {

        try {

          const responseBody = await error.context.json();

          if (responseBody && responseBody.error) {

            message = responseBody.error;

          }

        } catch (_) {}

      }

      const lowerMessage = message.toLowerCase();

      if (

        lowerMessage.includes("subscription") ||

        lowerMessage.includes("membership")

      ) {

        showAccessMessage(

          "A Stories subscription is required to read the complete book.",

          "RETURN TO SOVEREIGN PICTURES",

          "./index.html"

        );

      } else if (

        lowerMessage.includes("login") ||

        lowerMessage.includes("session")

      ) {

        showAccessMessage(

          "Your login session has expired. Please log in again.",

          "LOG IN",

          "./login.html"

        );

      } else {

        showAccessMessage(message);

      }

      return;

    }

    if (!data || !data.success || !data.signedUrl) {

      showAccessMessage(

        data?.error || "The full story could not be opened. Please try again."

      );

      return;

    }

    showAccessMessage("Subscription verified. Opening the complete AARYA book...");

    window.location.assign(data.signedUrl);

  } catch (error) {

    console.error("AARYA access error:", error);

    showAccessMessage(

      "Something went wrong while checking access. Please try again."

    );

  } finally {

    fullStoryButton.disabled = false;

    fullStoryButton.textContent = "READ FULL STORY";

  }

}

fullStoryButton.addEventListener("click", openFullStory);

/* KEYBOARD CONTROLS */

document.addEventListener("keydown", event => {

  if (event.key === "ArrowLeft") animatedTurn(1);

  if (event.key === "ArrowRight") animatedTurn(-1);

  if (event.key === "Escape") {

    window.location.href = "./index.html";

  }

});

/* SCREEN ROTATION */

let previousMode = isTwoPageMode();

window.addEventListener("resize", () => {

  const mode = isTwoPageMode();

  if (mode !== previousMode) {

    previousMode = mode;

    if (mode) currentPage = Math.floor(currentPage / 2) * 2;

    renderPages();

  }

});

renderPages();

</script>

</body>

</html>
