

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Join Sovereign Pictures</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      min-height: 100vh;

      display: grid;

      place-items: center;

      padding: 20px;

      background: #101010;

      color: #f5f0e8;

      font-family: Arial, sans-serif;

    }

    .panel {

      width: 100%;

      max-width: 410px;

      padding: 30px 24px;

      background: #1b1b1b;

      border: 1px solid #6d552a;

      border-radius: 14px;

    }

    h1 {

      text-align: center;

      color: #e2bd72;

      margin-top: 0;

    }

    .subtitle {

      text-align: center;

      color: #c3c3c3;

      margin-bottom: 24px;

    }

    input, button {

      width: 100%;

      padding: 13px;

      margin: 7px 0;

      border-radius: 7px;

      font-size: 16px;

    }

    input {

      border: 1px solid #555;

      background: #111;

      color: white;

    }

    button {

      border: 0;

      background: #d6b36b;

      color: #17120a;

      font-weight: bold;

      cursor: pointer;

    }

    .secondary {

      background: transparent;

      color: #e2bd72;

      border: 1px solid #6d552a;

    }

    #message {

      margin-top: 16px;

      line-height: 1.5;

      overflow-wrap: anywhere;

    }

    a { color: #e2bd72; }

  </style>

</head>

<body>

  <main class="panel">

    <h1>SOVEREIGN PICTURES</h1>

    <p class="subtitle">Your gateway to exclusive stories and cinema.</p>

    <form id="auth-form">

      <input id="email" type="email" placeholder="Email address"

        autocomplete="email" required>

      <input id="password" type="password" placeholder="Password"

        autocomplete="current-password" minlength="6" required>

      <button type="submit" id="login-button">Log In</button>

      <button type="button" class="secondary" id="signup-button">

        Create Account

      </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p><a href="index.html">Back to homepage</a></p>

  </main>

  <script type="module">

    import { createClient } from

      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://ffxmmzxknnrmglqvxwbc.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =

      "sb_publishable_sFi_I9me6VPQy0Saj5eQzg_csLKDtOt";

    const supabase = createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );

    const form = document.getElementById("auth-form");

    const message = document.getElementById("message");

    const loginButton = document.getElementById("login-button");

    const signupButton = document.getElementById("signup-button");

    function showMessage(text) {

      message.textContent = text;

    }

    signupButton.addEventListener("click", async () => {

      const email = document.getElementById("email").value.trim();

      const password = document.getElementById("password").value;

      if (!email || !password) {

        showMessage("Enter your email and password first.");

        return;

      }

      signupButton.disabled = true;

      showMessage("Creating your account...");

      try {

        const { data, error } = await supabase.auth.signUp({

          email,

          password,

          options: {

            emailRedirectTo:

              "https://venkat050403-commits.github.io/sovereign-pictures/"

          }

        });

        if (error) throw error;

        if (data.session) {

          showMessage("Account created! You can now log in.");

        } else {

          showMessage(

            "Registration started! Check your email for a confirmation link."

          );

        }

      } catch (error) {

        showMessage(error.message || "Registration failed. Please try again.");

      } finally {

        signupButton.disabled = false;

      }

    });

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      const password = document.getElementById("password").value;

      loginButton.disabled = true;

      showMessage("Logging in...");

      try {

        const { error } = await supabase.auth.signInWithPassword({

          email,

          password

        });

        if (error) throw error;

        window.location.href =

          "https://venkat050403-commits.github.io/sovereign-pictures/";

      } catch (error) {

        showMessage(error.message || "Login failed. Please try again.");

      } finally {

        loginButton.disabled = false;

      }

    });

  </script>

</body>

</html>
